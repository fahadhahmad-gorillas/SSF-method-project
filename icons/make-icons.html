<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gorillas — Icon Generator</title>
<style>
  body { background:#07071a; color:#e8e8ff; font-family:system-ui,Arial,sans-serif; text-align:center; padding:24px; }
  h1 { color:#ffd23f; }
  canvas { background:#111; margin:8px; border:1px solid #333; border-radius:8px; }
  a.btn { display:inline-block; background:#ffd23f; color:#1a1a00; font-weight:bold; text-decoration:none;
          padding:8px 16px; border-radius:6px; margin:6px; }
  .row { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; align-items:flex-end; }
  .item { display:flex; flex-direction:column; align-items:center; }
  p { color:#9a9ad0; max-width:560px; margin:12px auto; line-height:1.6; }
</style>
</head>
<body>
  <h1>🦍 Gorillas Icon Generator</h1>
  <p>This draws the app icons and lets you download them as PNG. Click each
     <b>Download</b> button and save the files into this <code>icons/</code> folder with the
     exact names shown. These are what the Play Store / App Store packaging needs.</p>
  <div class="row" id="out"></div>

<script>
function drawIcon(ctx, size, maskable) {
  const s = size;
  // background: rounded night-sky badge (maskable keeps art in safe zone)
  const pad = maskable ? s * 0.10 : 0;
  // sky
  const g = ctx.createLinearGradient(0, 0, 0, s);
  g.addColorStop(0, "#0b0530"); g.addColorStop(0.5, "#2a1450"); g.addColorStop(1, "#5a2350");
  ctx.fillStyle = g;
  roundRect(ctx, 0, 0, s, s, maskable ? 0 : s * 0.22); ctx.fill();

  ctx.save();
  ctx.translate(0, 0);
  const inner = s - pad * 2;
  const ox = pad, oy = pad;

  // stars
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 18; i++) {
    const x = ox + ((i * 73) % inner), y = oy + ((i * 131) % (inner * 0.55));
    const r = (i % 3 === 0) ? 2 : 1.2;
    ctx.globalAlpha = 0.6 + (i % 4) * 0.1;
    ctx.fillRect(x, y, r * (s/256), r * (s/256));
  }
  ctx.globalAlpha = 1;

  // sun
  ctx.fillStyle = "#ffe066";
  ctx.beginPath(); ctx.arc(ox + inner*0.78, oy + inner*0.22, inner*0.10, 0, Math.PI*2); ctx.fill();

  // skyline silhouette
  ctx.fillStyle = "#160f33";
  const base = oy + inner*0.72;
  for (let i = 0; i < 6; i++) {
    const bw = inner/6, bx = ox + i*bw;
    const bh = inner * (0.18 + ((i*97)%50)/100 * 0.34);
    ctx.fillRect(bx, base - bh, bw - inner*0.01, bh + inner*0.3);
  }

  // banana (foreground arc)
  ctx.save();
  ctx.translate(ox + inner*0.26, oy + inner*0.40);
  ctx.rotate(-0.5);
  ctx.fillStyle = "#ffe14d";
  const br = inner*0.11;
  ctx.beginPath();
  ctx.arc(0, 0, br, 0.2*Math.PI, 1.5*Math.PI);
  ctx.arc(br*0.3, br*0.3, br, 1.5*Math.PI, 0.2*Math.PI, true);
  ctx.fill();
  ctx.strokeStyle = "#c9a227"; ctx.lineWidth = s*0.006; ctx.stroke();
  ctx.restore();

  // gorilla head badge (center-bottom)
  const gx = ox + inner*0.52, gy = oy + inner*0.62, gw = inner*0.30, gh = inner*0.32;
  ctx.fillStyle = "#5a3a2a";
  roundRect(ctx, gx, gy, gw, gh, gw*0.3); ctx.fill();
  ctx.fillStyle = "#caa07a";
  roundRect(ctx, gx+gw*0.22, gy+gh*0.30, gw*0.56, gh*0.5, gw*0.2); ctx.fill();
  ctx.fillStyle = "#43291c"; ctx.fillRect(gx+gw*0.18, gy+gh*0.26, gw*0.64, gh*0.08);
  ctx.fillStyle = "#111";
  ctx.beginPath(); ctx.arc(gx+gw*0.36, gy+gh*0.42, gw*0.06, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(gx+gw*0.64, gy+gh*0.42, gw*0.06, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r);
  c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r);
  c.arcTo(x, y, x+w, y, r);
  c.closePath();
}

const specs = [
  { name: "icon-192.png", size: 192, maskable: false },
  { name: "icon-512.png", size: 512, maskable: false },
  { name: "icon-512-maskable.png", size: 512, maskable: true },
];
const out = document.getElementById("out");
for (const spec of specs) {
  const wrap = document.createElement("div"); wrap.className = "item";
  const cv = document.createElement("canvas");
  cv.width = cv.height = spec.size;
  cv.style.width = Math.min(spec.size, 220) + "px";
  cv.style.height = Math.min(spec.size, 220) + "px";
  drawIcon(cv.getContext("2d"), spec.size, spec.maskable);
  const a = document.createElement("a");
  a.className = "btn"; a.textContent = "⬇ " + spec.name;
  a.href = cv.toDataURL("image/png"); a.download = spec.name;
  const label = document.createElement("div");
  label.textContent = spec.size + "px" + (spec.maskable ? " (maskable)" : "");
  label.style.cssText = "font-size:12px;color:#9a9ad0;margin-top:4px";
  wrap.appendChild(cv); wrap.appendChild(label); wrap.appendChild(a);
  out.appendChild(wrap);
}
</script>
</body>
</html>
